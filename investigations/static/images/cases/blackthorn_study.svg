<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0D1117"/>
  <!-- Floor perspective lines -->
  <line x1="0" y1="500" x2="300" y2="350" stroke="#21262D" stroke-width="2"/>
  <line x1="800" y1="500" x2="500" y2="350" stroke="#21262D" stroke-width="2"/>
  <line x1="0" y1="350" x2="800" y2="350" stroke="#30363D" stroke-width="2"/>
  <!-- High Victorian study walls -->
  <rect x="50" y="50" width="150" height="300" fill="#161B22" stroke="#30363D"/>
  <text x="125" y="200" fill="#8B949E" font-family="monospace" font-size="12" text-anchor="middle">BOOKSHELVES</text>
  <!-- Fireplace hearth -->
  <path d="M 240 350 L 240 220 L 360 220 L 360 350 Z" fill="#1C2128" stroke="#484F58" stroke-width="2"/>
  <rect x="260" y="260" width="80" height="90" fill="#0D1117" stroke="#C6283D"/>
  <text x="300" y="310" fill="#C6283D" font-family="monospace" font-size="11" text-anchor="middle">HEARTH (AD-01)</text>
  <!-- Executive Mahogany Desk -->
  <polygon points="380,380 620,380 660,460 340,460" fill="#21262D" stroke="#D6B46A" stroke-width="2"/>
  <text x="500" y="425" fill="#D6B46A" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">EXECUTIVE DESK (AD-04)</text>
  <!-- Grandfather clock -->
  <rect x="20" y="160" width="40" height="190" fill="#161B22" stroke="#D6B46A"/>
  <circle cx="40" cy="200" r="14" fill="#0D1117" stroke="#D6B46A"/>
  <text x="40" y="270" fill="#D6B46A" font-family="monospace" font-size="9" text-anchor="middle">CLOCK</text>
  <!-- French Terrace Windows -->
  <rect x="620" y="80" width="140" height="270" fill="#161B22" stroke="#484F58" stroke-dasharray="6 3"/>
  <text x="690" y="200" fill="#8B949E" font-family="monospace" font-size="11" text-anchor="middle">TERRACE WINDOWS</text>
  <text x="400" y="30" fill="#E9E4DA" font-family="serif" font-size="16" font-weight="bold" text-anchor="middle">BLACKTHORN MANOR — PRIVATE STUDY SCHEMATIC</text>
</svg>
