<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#07090C"/>
  <!-- High Tech Observatory Dome curve -->
  <path d="M 100 380 Q 400 60 700 380" fill="none" stroke="#21262D" stroke-width="4"/>
  <!-- Floor line -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#30363D" stroke-width="2"/>
  <!-- Nitrogen Cooling Manifold -->
  <rect x="360" y="240" width="80" height="140" fill="#161B22" stroke="#388BFD" stroke-width="2"/>
  <circle cx="400" cy="270" r="14" fill="#0D1117" stroke="#C6283D"/>
  <text x="400" y="330" fill="#388BFD" font-family="monospace" font-size="10" text-anchor="middle">NITROGEN VALVE</text>
  <text x="400" y="345" fill="#C6283D" font-family="monospace" font-size="9" text-anchor="middle">(SL-02)</text>
  <!-- Server Bay Racks -->
  <rect x="580" y="180" width="120" height="200" fill="#161B22" stroke="#238636"/>
  <line x1="590" y1="220" x2="690" y2="220" stroke="#238636" stroke-width="2" stroke-dasharray="8 4"/>
  <line x1="590" y1="260" x2="690" y2="260" stroke="#238636" stroke-width="2" stroke-dasharray="8 4"/>
  <line x1="590" y1="300" x2="690" y2="300" stroke="#238636" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="640" y="340" fill="#238636" font-family="monospace" font-size="11" text-anchor="middle">SERVER NODE 02</text>
  <!-- Engineering SCADA Console -->
  <polygon points="120,280 240,280 260,380 100,380" fill="#1C2128" stroke="#D6B46A" stroke-width="2"/>
  <text x="180" y="330" fill="#D6B46A" font-family="monospace" font-size="11" text-anchor="middle">SCADA CONSOLE 4</text>
  <text x="400" y="30" fill="#E9E4DA" font-family="serif" font-size="16" font-weight="bold" text-anchor="middle">ORION OBSERVATORY — DOME 3 CRYOGENIC RECEIVER</text>
</svg>
