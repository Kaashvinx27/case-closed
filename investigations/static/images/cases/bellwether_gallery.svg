<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0A0C10"/>
  <!-- Conservation lab layout -->
  <line x1="0" y1="360" x2="800" y2="360" stroke="#30363D" stroke-width="2"/>
  <!-- Central Restoration Easel -->
  <polygon points="360,260 440,260 460,420 340,420" fill="#161B22" stroke="#D6B46A" stroke-width="2"/>
  <rect x="370" y="275" width="60" height="80" fill="#21262D" stroke="#C6283D" stroke-width="2"/>
  <text x="400" y="320" fill="#E9E4DA" font-family="serif" font-size="9" text-anchor="middle">THE VEILED SAINT</text>
  <!-- Chemical Wash Sink -->
  <rect x="180" y="320" width="100" height="70" fill="#1C2128" stroke="#484F58"/>
  <text x="230" y="360" fill="#8B949E" font-family="monospace" font-size="10" text-anchor="middle">WASH SINK (LF-03)</text>
  <!-- Fire Exit Door -->
  <rect x="680" y="160" width="80" height="200" fill="#161B22" stroke="#C6283D" stroke-width="2"/>
  <text x="720" y="260" fill="#C6283D" font-family="monospace" font-size="10" text-anchor="middle">FIRE EXIT (LF-05)</text>
  <!-- Chemical Fume Hood & Workbench -->
  <rect x="500" y="240" width="140" height="120" fill="#161B22" stroke="#388BFD"/>
  <text x="570" y="305" fill="#388BFD" font-family="monospace" font-size="10" text-anchor="middle">SOLVENT BENCH</text>
  <text x="400" y="30" fill="#E9E4DA" font-family="serif" font-size="16" font-weight="bold" text-anchor="middle">BELLWETHER MUSEUM — CONSERVATION ROOM B</text>
</svg>
